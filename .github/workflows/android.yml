name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then echo 'No source ZIP found in repository root'; exit 1; fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT" ]; then echo 'Gradle project not found inside ZIP'; exit 1; fi
